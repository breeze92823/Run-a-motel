name: Deploy to Bloxity

# Builds the frontend once and uploads it to Bloxity Hosting on every platform
# (docs.bloxity.io > Environments > Release flow):
#   main -> prod channel, dev -> dev (playtest) channel, on prod always and on stage too once the
#   repo has the secret LEGION_DEPLOY_TOKEN_STAGE. The platforms are separate matrix jobs, so a
#   stage failure never blocks or undoes the prod deploy.
#   Run workflow (workflow_dispatch) deploys any branch to the one platform you pick.
# Needs LEGION_GAME_ID (variable or secret), LEGION_DEPLOY_TOKEN (prod secret, hosting.bloxity.io)
# and optionally LEGION_DEPLOY_TOKEN_STAGE (stage secret, hosting.stage.bloxity.io).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [staging, prod]
        default: staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.t.outputs.list }}
    steps:
      - id: t
        env:
          HAS_STAGE_TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN_STAGE != '' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo 'list=["${{ inputs.target }}"]' >> "$GITHUB_OUTPUT"
          elif [ "$HAS_STAGE_TOKEN" != "true" ]; then echo 'list=["prod"]' >> "$GITHUB_OUTPUT"
          else echo 'list=["prod","staging"]' >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # staging can never take prod down with it
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    env:
      GAME_ID: ${{ vars.LEGION_GAME_ID || secrets.LEGION_GAME_ID }}
      BLOXITY_API_URL: ${{ matrix.target == 'staging' && 'https://api.stage.bloxity.io' || 'https://api.bloxity.io' }}
      # A staging job only ever reads the stage token (never the prod one).
      DEPLOY_TOKEN: ${{ secrets[matrix.target == 'staging' && 'LEGION_DEPLOY_TOKEN_STAGE' || 'LEGION_DEPLOY_TOKEN'] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Determine deploy channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "channel=prod" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy config
        run: |
          if [ -z "${GAME_ID}" ]; then
            echo "::error::LEGION_GAME_ID is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "::error::The ${{ matrix.target }} deploy token is not set (LEGION_DEPLOY_TOKEN for prod, LEGION_DEPLOY_TOKEN_STAGE for staging)."
            exit 1
          fi

      - name: Build
        # One build for every platform: no environment, API URL or server URL is baked in. The page
        # learns prod / stage from Boxity (window.BLOXITY_ENV / the portal handshake), and reaches
        # Run-a-motel-backend through the Bloxity matchmaker (Legion.SDK.net.resolveEndpoint).
        # VITE_DEV_MODE is deliberately unset so deployed builds use the real Bloxity SDK.
        run: |
          if [ "${{ steps.channel.outputs.channel }}" = "prod" ]; then
            npm run build
          else
            npm run build:dev
          fi

      - name: Zip build
        run: cd dist && zip -r ../build.zip . && cd ..

      - name: Upload to Bloxity (${{ matrix.target }})
        run: |
          curl -sS -f -X POST \
            "${BLOXITY_API_URL}/v1/hosting/games/${GAME_ID}/frontend?channel=${{ steps.channel.outputs.channel }}&version=${{ github.sha }}" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary @build.zip \
            -w "\nHTTP status: %{http_code}\n"
